<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:20px Arial,sans-serif;fill:#475569}
      .head{font:700 25px Arial,sans-serif;fill:#0f172a}
      .body{font:19px Arial,sans-serif;fill:#334155}
      .small{font:17px Arial,sans-serif;fill:#64748b}
      .label{font:700 17px Arial,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="60" y="70" class="title">STM32F411 PID Temperature Control System</text>
  <text x="60" y="105" class="subtitle">Embedded control architecture • firmware + serial protocol + PC monitoring</text>

  <rect x="70" y="290" rx="24" ry="24" width="300" height="180" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/>
  <text x="105" y="340" class="head">DHT22 Sensor</text>
  <text x="105" y="380" class="body">Temperature acquisition</text>
  <text x="105" y="412" class="small">Digital sensor interface</text>

  <rect x="585" y="245" rx="26" ry="26" width="430" height="290" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="690" y="300" class="head">STM32F411 Controller</text>
  <rect x="630" y="335" rx="14" ry="14" width="150" height="62" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="662" y="374" class="body">PID Control</text>
  <rect x="820" y="335" rx="14" ry="14" width="150" height="62" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="860" y="374" class="body">Timers</text>
  <rect x="630" y="425" rx="14" ry="14" width="150" height="62" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="681" y="464" class="body">PWM</text>
  <rect x="820" y="425" rx="14" ry="14" width="150" height="62" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="851" y="464" class="body">USART6</text>

  <rect x="1190" y="285" rx="24" ry="24" width="330" height="190" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="1230" y="340" class="head">Heater / Actuator Stage</text>
  <text x="1230" y="382" class="body">External power driver</text>
  <text x="1230" y="414" class="small">Controlled by PWM output</text>

  <rect x="1080" y="75" rx="24" ry="24" width="440" height="145" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="1120" y="125" class="head">Python Desktop GUI</text>
  <text x="1120" y="165" class="body">Tkinter • PySerial • Matplotlib</text>
  <text x="1120" y="195" class="small">Monitor • configure setpoint • tune PID gains</text>

  <rect x="455" y="625" rx="22" ry="22" width="320" height="130" fill="#fffbeb" stroke="#eab308" stroke-width="3"/>
  <text x="505" y="675" class="head">16x2 LCD</text>
  <text x="505" y="716" class="body">Local temperature / setpoint</text>

  <rect x="855" y="625" rx="22" ry="22" width="350" height="130" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/>
  <text x="895" y="675" class="head">W25Qxx SPI NOR Flash</text>
  <text x="895" y="716" class="body">Setpoint + PID parameters</text>

  <line x1="370" y1="380" x2="575" y2="380" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="405" y="350" class="label">Temperature feedback</text>

  <line x1="1025" y1="380" x2="1180" y2="380" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="1045" y="350" class="label">TIM3 PWM</text>

  <line x1="985" y1="245" x2="1120" y2="220" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <line x1="1120" y1="205" x2="985" y2="230" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="920" y="175" class="label">USART6 • 115200 • DMA</text>

  <line x1="715" y1="535" x2="650" y2="615" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="560" y="585" class="label">Local display</text>

  <line x1="885" y1="535" x2="1000" y2="615" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="950" y="580" class="label">SPI</text>

  <path d="M1355 475 L1355 560 L220 560 L220 480" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-green)"/>
  <text x="600" y="595" class="small">Closed-loop path: measure → compute PID → actuate → measure again</text>

  <text x="60" y="795" class="small">Architecture diagram only; measured control-performance metrics are documented separately when hardware test data is available.</text>
</svg>